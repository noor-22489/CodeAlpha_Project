<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="icon" href="img/portfolio.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <nav>
    <div class="nav-container">
      <div class="logo">
        <span><a href="portfolio.html">Noor</a></span>
      </div>
      <ul class="links">
        <li><a href="portfolio.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="contact">
      <div class="contact-heading hidden">
        <h2>Contact</h2>
        <p>Feel free to get in touch. I'd love to work with you!</p>
      </div>

      <div class="contact-container">
        <div class="contact-info hidden">
          <div class="info-box">
            <i class="fa-solid fa-location-dot"></i>
            <div>
              <h3>Address</h3>
              <p>Islamabad, Pakistan</p>
            </div>
          </div>

          <div class="info-box">
            <i class="fa-solid fa-phone"></i>
            <div>
              <h3>Phone</h3>
              <p>+92 340 6749730</p>
            </div>
          </div>

          <div class="info-box">
            <i class="fa-solid fa-envelope"></i>
            <div>
              <h3>Email Us</h3>
              <p>noor@gmail.com</p>
            </div>
          </div>

          <iframe src="https://maps.google.com/maps?q=Islamabad&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
        </div>

        <div class="contact-form hidden">
          <div class="form">
            <form class="input-row">
              <div>
               <label>Name:</label> 
               <input type="text" required>             
              </div>

             <div>
              <label>Email:</label> 
              <input type="email" required> 
             </div>

             <div>
              <label>Suject:</label> 
              <input type="text" required> 
             </div>

             <div>
              <label>Message:</label> 
              <textarea rows="10"></textarea> 
             </div>

            <button type="submit">Send Message</button>

            <p id="successMessage"></p>
          </form>

          <div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span>Copyright</span> <strong>Noor</strong></p>
    <div class="social-icons">
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
      </div>
  </footer>
  <script src="contact.js"></script>
</body>
</html>
